memory_limit = 512M
upload_max_filesize = 100M
post_max_size = 100M
max_execution_time = 150
expose_php = Off
date.timezone = UTC

opcache.enable = 1
; Off for the CLI roles (queue, queue-ai, scheduler, reverb, ssr, migrate).
; A CLI process never shares its opcache with another, so each container paid
; for its own shared memory (~30 MB measured per worker) and every
; schedule:run child spent ~300 ms setting it up, with nothing to reuse: a
; long-lived worker compiles each file once either way, and its jobs wait on
; HTTP and the database, not CPU. The FrankenPHP SAPI uses opcache.enable.
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.jit_buffer_size = 100M
opcache.jit = tracing

realpath_cache_size = 4096K
realpath_cache_ttl = 600
