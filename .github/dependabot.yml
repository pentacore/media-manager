# Dependabot dependency updates. Commit-message conventions match
# semantic-release rules in .releaserc.*.json:
#   chore(deps)     → patch  (production dependencies)
#   chore(deps-dev) → none   (development dependencies — not shipped to runtime)
#   ci(deps)        → none   (github-actions versions)
#
# Minor/patch updates are grouped per ecosystem and dependency type, so the
# deps vs deps-dev prefix (and therefore the release decision) stays accurate.
# Major updates are left ungrouped and arrive as individual PRs.
#
# Every ecosystem waits 5 days after a release before proposing it, so a
# compromised or broken release has time to be pulled first. Security
# updates are not delayed.

version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      composer-production:
        dependency-type: production
        update-types: [minor, patch]
      composer-development:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      npm-production:
        dependency-type: production
        update-types: [minor, patch]
      npm-development:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # 3.3.12-3.3.14 rewrite `//` inside static prop strings into block
      # comments and break types:check (vuejs/language-tools#6240). The fix
      # (#6297) landed on feat/vue-content-mapper, not in 3.3.14. Drop this
      # once a release with it is out.
      - dependency-name: vue-tsc
        versions: ['3.3.12', '3.3.13', '3.3.14']
      # eslint-plugin-vue 10.12.1 peers @stylistic/eslint-plugin ^5. Support
      # for 6 is merged (vuejs/eslint-plugin-vue#3264) but unreleased. Drop
      # this once an eslint-plugin-vue release allows ^6.
      - dependency-name: '@stylistic/eslint-plugin'
        update-types: ['version-update:semver-major']
      # typescript-eslint 8.73 peers typescript <6.1, and vue-tsc still needs
      # the classic compiler API that TypeScript 7 drops. Drop this once both
      # support 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    commit-message:
      prefix: 'ci(deps)'
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /docker/production
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
