# Dependabot dependency updates. Commit-message conventions match
# semantic-release rules in .releaserc.*.json:
#   chore(deps)     → patch  (production dependencies)
#   chore(deps-dev) → none   (development dependencies — not shipped to runtime)
#   ci(deps)        → none   (github-actions versions)
#
# Minor/patch updates are grouped per ecosystem and dependency type, so the
# deps vs deps-dev prefix (and therefore the release decision) stays accurate.
# Major updates are left ungrouped and arrive as individual PRs.
#
# Every ecosystem waits 5 days after a release before proposing it, so a
# compromised or broken release has time to be pulled first. Security
# updates are not delayed.

version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      composer-production:
        dependency-type: production
        update-types: [minor, patch]
      composer-development:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      npm-production:
        dependency-type: production
        update-types: [minor, patch]
      npm-development:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # 3.3.12-3.3.14 rewrite `//` inside static prop strings into block
      # comments and break types:check (vuejs/language-tools#6240). The fix
      # (#6297) landed on feat/vue-content-mapper, not in 3.3.14. Drop this
      # once a release with it is out.
      - dependency-name: vue-tsc
        versions: ['3.3.12', '3.3.13', '3.3.14']
      # vue-tsc runs on the classic compiler API (`typescript/lib/tsc`), which
      # TypeScript 7 no longer ships. Drop this once vue-tsc or its successor
      # checks .vue files on TypeScript 7 (vuejs/language-tools#6167).
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # vite-plus, the `vite` alias in package.json and the `vite` override in
      # pnpm-workspace.yaml must name the same Vite+ release, and Dependabot
      # only bumps one of the three. Bump them together by hand.
      - dependency-name: vite-plus
      - dependency-name: vite

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    commit-message:
      prefix: 'ci(deps)'
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /docker/production
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
