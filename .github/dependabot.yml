# Dependabot dependency updates. Commit-message conventions match
# semantic-release rules in .releaserc.*.json:
#   chore(deps)     → patch  (production dependencies)
#   chore(deps-dev) → none   (development dependencies — not shipped to runtime)
#   ci(deps)        → none   (github-actions versions)

version: 2
updates:
  - package-ecosystem: composer
    target-branch: develop
    directory: /
    schedule:
      interval: weekly
    commit-message:
      include: scope

  - package-ecosystem: npm
    target-branch: develop
    directory: /
    schedule:
      interval: weekly
    commit-message:
      include: scope

  - package-ecosystem: github-actions
    target-branch: develop
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'ci(deps)'

  - package-ecosystem: docker
    target-branch: develop
    directory: /docker/production
    schedule:
      interval: weekly
    commit-message:
      include: scope
