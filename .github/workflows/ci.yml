name: ci

on:
  # Push: main only (gates semantic-release via workflow_run). PRs into
  # develop/main run via pull_request — no need to also run on the post-merge
  # push since the same code already passed the PR check.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: no job here writes to the repo, packages or PRs.
permissions:
  contents: read

env:
  PHP_VERSION: '8.5'
  NODE_VERSION: '25'

jobs:
  php-lint:
    name: PHP lint (Pint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2
          coverage: none

      - name: Cache composer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ env.PHP_VERSION }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-${{ env.PHP_VERSION }}-

      - name: Install composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Run Pint
        run: vendor/bin/pint --test --format=checkstyle

  php-analysis:
    name: PHP static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2
          coverage: none

      - name: Cache composer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ env.PHP_VERSION }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-${{ env.PHP_VERSION }}-

      - name: Install composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Rector (dry run)
        run: vendor/bin/rector process --dry-run --no-progress-bar

      # Larastan boots the application. Array/sync drivers keep it off Valkey
      # (the app otherwise reaches Redis while booting) and sqlite keeps it
      # off Postgres; nothing is queried.
      - name: Larastan
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          MEDIAMANAGER_CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          BROADCAST_CONNECTION: 'null'
          TELESCOPE_ENABLED: 'false'
        run: vendor/bin/phpstan analyse --memory-limit=2G --no-progress

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Runtime dependencies ship in the image and the browser/SSR bundle: a
      # known advisory there blocks the merge.
      - name: Composer audit (runtime)
        run: composer audit --locked --no-dev --abandoned=report

      - name: npm audit (runtime, high and above)
        run: npm audit --omit=dev --audit-level=high --package-lock-only

      # Dev tooling (Pest, Rector, semantic-release, Vite plugins) never
      # ships. Report its advisories without failing every PR on upstream
      # release timing; Dependabot opens the fixes.
      - name: Composer audit (all, report only)
        continue-on-error: true
        run: composer audit --locked --abandoned=report

      - name: npm audit (all, report only)
        continue-on-error: true
        run: npm audit --audit-level=high --package-lock-only

  js-lint:
    name: JS lint, format & types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_sqlite, sqlite3
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cache composer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ env.PHP_VERSION }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-${{ env.PHP_VERSION }}-

      - name: Install composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Install npm dependencies
        run: npm ci

      # .env.example targets sail (DB_HOST=pgsql). js-lint runs on sqlite to
      # avoid spinning a pg service just for type generation. No .env file —
      # APP_KEY/DB_* are passed as env vars and Laravel reads them directly.
      - name: Prepare sqlite + run migrations
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
          TELESCOPE_ENABLED: 'false'
        run: |
          mkdir -p database
          touch database/database.sqlite
          php artisan migrate --force --no-interaction

      - name: Generate Wayfinder + Typefinder type definitions
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
          TELESCOPE_ENABLED: 'false'
        run: |
          php artisan wayfinder:generate --with-form
          php artisan typefinder:generate

      - name: Prettier
        run: npm run format:check

      - name: ESLint
        run: npm run lint:check

      - name: TypeScript types
        run: npm run types:check

  tests:
    name: Pest tests
    runs-on: ubuntu-latest
    # A hung Playwright browser otherwise burns the 6h default.
    timeout-minutes: 40

    services:
      pgsql:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      valkey:
        image: valkey/valkey:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="valkey-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      typesense:
        image: typesense/typesense:27.1
        env:
          TYPESENSE_DATA_DIR: /typesense-data
          TYPESENSE_API_KEY: xyz
          TYPESENSE_ENABLE_CORS: 'true'
        ports:
          - 8108:8108

    env:
      APP_ENV: testing
      APP_DEBUG: 'true'
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: testing
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      BROADCAST_CONNECTION: log
      TYPESENSE_HOST: 127.0.0.1
      TYPESENSE_PORT: 8108
      TYPESENSE_API_KEY: xyz

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, redis, intl, bcmath, gd, zip, sodium
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cache composer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ env.PHP_VERSION }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-${{ env.PHP_VERSION }}-

      - name: Install composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Build frontend assets
        run: npm run build

      - name: Run Pest (unit & feature)
        run: vendor/bin/pest --compact --parallel --exclude-testsuite=Browser

      # Browser tests drive a real Chromium via Playwright. Running them under
      # --parallel starves the box and intermittently trips Playwright's 15s
      # navigation timeout on page load. Run them serially, on their own.
      # Same script developers run locally, so the SSR-backed suite cannot drift
      # between the two: it starts the SSR server, waits for it to report healthy
      # and runs the browser suite with SSR errors fatal.
      - name: Run Pest (browser with SSR)
        run: composer test:browser

      # A browser failure saves a screenshot of the page; keep it so a flake
      # shows what was on screen instead of only "Timeout 30000ms exceeded".
      - name: Upload browser failure screenshots
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-screenshots
          path: tests/Browser/Screenshots
          if-no-files-found: ignore
          retention-days: 14

  octane-smoke:
    name: Octane smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: tests

    services:
      pgsql:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      valkey:
        image: valkey/valkey:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="valkey-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      typesense:
        image: typesense/typesense:27.1
        env:
          TYPESENSE_DATA_DIR: /typesense-data
          TYPESENSE_API_KEY: xyz
          TYPESENSE_ENABLE_CORS: 'true'
        ports:
          - 8108:8108

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pre-generate Wayfinder + Typefinder types
        uses: ./.github/actions/generate-types
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: app
          DB_USERNAME: postgres
          DB_PASSWORD: postgres

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build production image (amd64, load locally)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/production/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: mediamanager:octane-smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate APP_KEY
        id: app_key
        run: |
          KEY=$(docker run --rm mediamanager:octane-smoke php -r "echo 'base64:'.base64_encode(random_bytes(32));")
          echo "APP_KEY=$KEY" >> "$GITHUB_OUTPUT"

      - name: Run container (web/Octane role)
        env:
          APP_KEY: ${{ steps.app_key.outputs.APP_KEY }}
        run: |
          docker run -d \
            --name octane \
            --network host \
            -e APP_KEY="$APP_KEY" \
            -e APP_ENV=production \
            -e APP_DEBUG=false \
            -e APP_URL=http://127.0.0.1:8080 \
            -e CONTAINER_ROLE=web \
            -e RUN_MIGRATIONS=true \
            -e LOG_CHANNEL=stderr \
            -e DB_CONNECTION=pgsql \
            -e DB_HOST=127.0.0.1 \
            -e DB_PORT=5432 \
            -e DB_DATABASE=app \
            -e DB_USERNAME=postgres \
            -e DB_PASSWORD=postgres \
            -e CACHE_STORE=redis \
            -e SESSION_DRIVER=redis \
            -e QUEUE_CONNECTION=sync \
            -e BROADCAST_CONNECTION=log \
            -e MAIL_MAILER=log \
            -e REDIS_HOST=127.0.0.1 \
            -e REDIS_PORT=6379 \
            -e TYPESENSE_HOST=127.0.0.1 \
            -e TYPESENSE_PORT=8108 \
            -e TYPESENSE_API_KEY=xyz \
            mediamanager:octane-smoke

      - name: Wait for /up
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/up > /dev/null 2>&1; then
              echo "Octane up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Octane failed to start within 60s" >&2
          docker logs octane >&2
          exit 1

      - name: Hammer /up (200 requests, assert all 200 OK)
        run: |
          fail=0
          for i in $(seq 1 200); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/up)
            if [ "$code" != "200" ]; then
              echo "Request $i: HTTP $code" >&2
              fail=$((fail + 1))
            fi
          done
          if [ "$fail" -gt 0 ]; then
            echo "$fail/200 requests failed" >&2
            exit 1
          fi
          echo "All 200 requests returned 200 OK"

      - name: Smoke public routes
        run: |
          for path in / /login; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080${path}")
            echo "GET ${path} -> ${code}"
            # 200/302/419 (CSRF on first hit) are all acceptable; 5xx is not.
            case "$code" in
              5*) echo "5xx on ${path}" >&2; exit 1 ;;
            esac
          done

      - name: Assert no PHP errors in logs
        run: |
          logs=$(docker logs octane 2>&1)
          echo "$logs"
          if echo "$logs" | grep -Ei 'PHP (Fatal|Parse) error|Uncaught.*Exception|Stack trace:' ; then
            echo "PHP errors detected in Octane logs" >&2
            exit 1
          fi

      # The queue/queue-ai/scheduler/ssr/reverb/migrate entrypoint blocks
      # otherwise run for the first time in production — a bash typo or
      # renamed artisan flag would ship green and crash-loop the worker. Boot
      # each role and assert it stays up. (reverb binds :8080, so the web
      # container is stopped first; ssr binds :13714.)
      - name: Smoke queue/queue-ai/scheduler/ssr/reverb roles
        env:
          APP_KEY: ${{ steps.app_key.outputs.APP_KEY }}
        run: |
          docker rm -f octane
          for role in queue queue-ai scheduler ssr reverb; do
            docker run -d \
              --name "$role" \
              --network host \
              -e APP_KEY="$APP_KEY" \
              -e APP_ENV=production \
              -e APP_DEBUG=false \
              -e APP_URL=http://127.0.0.1:8080 \
              -e CONTAINER_ROLE="$role" \
              -e LOG_CHANNEL=stderr \
              -e DB_CONNECTION=pgsql \
              -e DB_HOST=127.0.0.1 \
              -e DB_PORT=5432 \
              -e DB_DATABASE=app \
              -e DB_USERNAME=postgres \
              -e DB_PASSWORD=postgres \
              -e CACHE_STORE=redis \
              -e SESSION_DRIVER=redis \
              -e QUEUE_CONNECTION=redis \
              -e BROADCAST_CONNECTION=log \
              -e MAIL_MAILER=log \
              -e REDIS_HOST=127.0.0.1 \
              -e REDIS_PORT=6379 \
              -e TYPESENSE_HOST=127.0.0.1 \
              -e TYPESENSE_PORT=8108 \
              -e TYPESENSE_API_KEY=xyz \
              mediamanager:octane-smoke
          done
          sleep 10
          fail=0
          for role in queue queue-ai scheduler ssr reverb; do
            if [ "$(docker inspect -f '{{.State.Running}}' "$role")" != "true" ]; then
              echo "--- $role container exited ---" >&2
              docker logs "$role" >&2 || true
              fail=1
            else
              echo "$role role healthy after 10s"
            fi
          done
          exit "$fail"

      # Staying up is not enough for SSR: the Node bundle must actually resolve
      # its imports and render. A bundle that externalises npm packages boots
      # the artisan command and then dies, because the runtime image ships no
      # node_modules — so assert the SSR server answers on its own port.
      - name: Assert SSR server renders
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:13714/health > /dev/null 2>&1; then
              echo "SSR server healthy after ${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "SSR server never became healthy" >&2
              docker logs ssr >&2
              exit 1
            fi
            sleep 1
          done
          body=$(curl -fsS -X POST http://127.0.0.1:13714/render \
            -H 'Content-Type: application/json' \
            -d '{"component":"auth/Login","props":{"errors":{},"auth":{"user":null}},"url":"/login","version":"1","clearHistory":false,"encryptHistory":false}')
          echo "$body" | head -c 500
          if echo "$body" | grep -q '"error"'; then
            echo "SSR render returned an error" >&2
            docker logs ssr >&2
            exit 1
          fi
          if ! echo "$body" | grep -q 'data-server-rendered'; then
            echo "SSR render produced no server-rendered markup" >&2
            docker logs ssr >&2
            exit 1
          fi
          echo "SSR rendered auth/Login successfully"

      - name: Stop containers
        if: always()
        run: docker rm -f octane queue queue-ai scheduler ssr reverb || true
