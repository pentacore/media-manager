name: release

# Runs after `ci` completes successfully on main or develop. Reads conventional
# commits since the last tag, decides next version, generates release notes,
# and pushes a `v{version}` tag — which docker.yml consumes to build versioned
# images.
#
# main → stable channel, tags vX.Y.Z, commits CHANGELOG.md back. The develop
# prerelease channel was retired when the workflow moved to PRs → main.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

concurrency:
  group: release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    outputs:
      published: ${{ steps.sr.outputs.new_release_published }}
      version: ${{ steps.sr.outputs.new_release_version }}

    steps:
      # Checkout the current branch tip (not workflow_run.head_sha). If a PR
      # merged after the triggering ci kicked off, head_sha is behind tip and
      # semantic-release refuses to publish ("local branch is behind remote").
      # Operating on the tip means we always release the latest commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.event.workflow_run.head_branch }}

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # semantic-release 26 requires Node >= 26.13.
          node-version: '26'
          cache: pnpm

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Stage releaserc
        run: cp .releaserc.main.json .releaserc.json

      # Runs the repo's own semantic-release (pnpm-lock) on the Node set up
      # above. cycjimmy/semantic-release-action ran it inside the action's own
      # Node 24 runtime, which semantic-release 26 no longer supports. The
      # outputs it exposed are rebuilt here: a release leaves a new v* tag on the
      # chore(release) commit that @semantic-release/git made at HEAD (a re-run
      # on an already released tip finds the old tag and publishes nothing).
      - id: sr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          before="$(git tag --points-at HEAD --list 'v*' | head -n 1)"
          pnpm exec semantic-release
          tag="$(git tag --points-at HEAD --list 'v*' | head -n 1)"
          if [ -n "$tag" ] && [ "$tag" != "$before" ]; then
            echo "new_release_published=true" >> "$GITHUB_OUTPUT"
            echo "new_release_version=${tag#v}" >> "$GITHUB_OUTPUT"
          else
            echo "new_release_published=false" >> "$GITHUB_OUTPUT"
          fi

      # Tags pushed via GITHUB_TOKEN do NOT trigger other workflows
      # (GitHub safety rule against recursive runs). docker.yml therefore
      # never fires from semantic-release tags. Manually dispatch it
      # against the new tag so the release image gets built.
      #
      # GITHUB_TOKEN cannot dispatch workflows from a workflow_run-triggered
      # job (HTTP 403, same recursion guard), so this step uses a PAT with
      # `actions: write` on this repo stored as RELEASE_DISPATCH_PAT.
      - name: Trigger docker build for new tag
        if: ${{ steps.sr.outputs.new_release_published == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_DISPATCH_PAT }}
          TAG: v${{ steps.sr.outputs.new_release_version }}
        run: gh workflow run docker.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"

  sync-develop:
    name: sync main → develop
    needs: release
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.head_branch == 'main' && needs.release.outputs.published == 'true' }}
    permissions:
      contents: write
      pull-requests: write

    steps:
      # `develop` is protected — direct pushes are rejected by repository
      # rules, so we open a PR from a temporary sync branch and let GitHub
      # auto-merge it once required checks pass.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: develop
          token: ${{ secrets.RELEASE_DISPATCH_PAT }}

      - name: Open sync PR and enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.RELEASE_DISPATCH_PAT }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main develop

          # Fast-forward bail: nothing to sync.
          if git merge-base --is-ancestor origin/main origin/develop; then
            echo 'develop already contains main — nothing to sync.'
            exit 0
          fi

          BRANCH="sync/main-into-develop-${RUN_ID}"
          git checkout -B "$BRANCH" origin/develop
          git merge --no-ff origin/main -m 'chore: sync main into develop'
          git push origin "$BRANCH"

          gh pr create --base develop --head "$BRANCH" \
            --title 'chore: sync main into develop' \
            --body 'Auto-generated after main release. Will auto-merge once required checks pass.'
          gh pr merge "$BRANCH" --auto --merge --delete-branch
