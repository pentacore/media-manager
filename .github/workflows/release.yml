name: release

# Runs after `ci` completes successfully on main or develop. Reads conventional
# commits since the last tag, decides next version, generates release notes,
# and pushes a `v{version}` tag — which docker.yml consumes to build versioned
# images.
#
# main    → stable channel,    tags vX.Y.Z,             commits CHANGELOG.md back
# develop → prerelease channel, tags vX.Y.Z-develop.N,   no CHANGELOG mutation

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main, develop]

concurrency:
  group: release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    outputs:
      published: ${{ steps.sr.outputs.new_release_published }}
      version: ${{ steps.sr.outputs.new_release_version }}

    steps:
      # Checkout the current branch tip (not workflow_run.head_sha). If a PR
      # merged after the triggering ci kicked off, head_sha is behind tip and
      # semantic-release refuses to publish ("local branch is behind remote").
      # Operating on the tip means we always release the latest commit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.event.workflow_run.head_branch }}

      - uses: actions/setup-node@v7
        with:
          node-version: '25'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Stage releaserc for branch
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ "$BRANCH" = "main" ]; then
            cp .releaserc.main.json .releaserc.json
          else
            cp .releaserc.develop.json .releaserc.json
          fi

      # semantic-release evaluates every branch in its config (main + develop)
      # and runs `git tag --merged <branch>` for each. checkout only creates a
      # local branch for the checked-out ref, so the other branch resolves only
      # as origin/<branch> and `git tag --merged <branch>` fails with
      # "malformed object name". Point local branches at their origin refs
      # (fetch-depth: 0 already fetched them) so every configured branch resolves.
      - name: Ensure configured release branches exist locally
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          for b in main develop; do
            if [ "$b" != "$BRANCH" ]; then
              git branch --force "$b" "origin/$b"
            fi
          done

      - id: sr
        uses: cycjimmy/semantic-release-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Tags pushed via GITHUB_TOKEN do NOT trigger other workflows
      # (GitHub safety rule against recursive runs). docker.yml therefore
      # never fires from semantic-release tags. Manually dispatch it
      # against the new tag so the release image gets built.
      #
      # GITHUB_TOKEN cannot dispatch workflows from a workflow_run-triggered
      # job (HTTP 403, same recursion guard), so this step uses a PAT with
      # `actions: write` on this repo stored as RELEASE_DISPATCH_PAT.
      - name: Trigger docker build for new tag
        if: ${{ steps.sr.outputs.new_release_published == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_DISPATCH_PAT }}
          TAG: v${{ steps.sr.outputs.new_release_version }}
        run: gh workflow run docker.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"

  sync-develop:
    name: sync main → develop
    needs: release
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.head_branch == 'main' && needs.release.outputs.published == 'true' }}
    permissions:
      contents: write
      pull-requests: write

    steps:
      # `develop` is protected — direct pushes are rejected by repository
      # rules, so we open a PR from a temporary sync branch and let GitHub
      # auto-merge it once required checks pass.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: develop
          token: ${{ secrets.RELEASE_DISPATCH_PAT }}

      - name: Open sync PR and enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.RELEASE_DISPATCH_PAT }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main develop

          # Fast-forward bail: nothing to sync.
          if git merge-base --is-ancestor origin/main origin/develop; then
            echo 'develop already contains main — nothing to sync.'
            exit 0
          fi

          BRANCH="sync/main-into-develop-${RUN_ID}"
          git checkout -B "$BRANCH" origin/develop
          git merge --no-ff origin/main -m 'chore: sync main into develop'
          git push origin "$BRANCH"

          gh pr create --base develop --head "$BRANCH" \
            --title 'chore: sync main into develop' \
            --body 'Auto-generated after main release. Will auto-merge once required checks pass.'
          gh pr merge "$BRANCH" --auto --merge --delete-branch
