name: Generate Wayfinder + Typefinder types
description: |
  Boots a minimal Laravel install (sqlite + migrations) so wayfinder:generate
  and typefinder:generate can emit TypeScript types. Used to pre-build types
  before any Vite build that runs with SKIP_TYPE_GENERATION=1.

inputs:
  php-version:
    description: PHP version
    required: false
    default: '8.5'

runs:
  using: composite
  steps:
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.php-version }}
        extensions: pdo_sqlite, sqlite3
        tools: composer:v2
        coverage: none

    - name: Cache composer
      uses: actions/cache@v4
      with:
        path: ~/.cache/composer
        key: composer-${{ runner.os }}-${{ inputs.php-version }}-${{ hashFiles('**/composer.lock') }}
        restore-keys: composer-${{ runner.os }}-${{ inputs.php-version }}-

    - name: Install composer dependencies
      shell: bash
      run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

    # Laravel refuses to boot without APP_KEY, but nothing in migrate / wayfinder /
    # typefinder actually *uses* it — a dummy 32-byte key just satisfies the bootstrapper.
    # No .env file: env vars take precedence and config/*.php fallbacks (sqlite,
    # database/database.sqlite) cover the rest.
    - name: Generate Wayfinder + Typefinder types
      shell: bash
      env:
        APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        APP_ENV: production
      run: |
        mkdir -p database
        touch database/database.sqlite
        php artisan migrate --force --no-interaction
        php artisan wayfinder:generate --with-form
        php artisan typefinder:generate
        rm -f database/database.sqlite
