packages:
    - '.'

publicHoistPattern:
    - '@inertiajs/core'

# Vite+ ships its own Vite build (vite-plus-core). Every package that asks for
# `vite` gets it, so `vp dev` / `vp build` drive one Vite. Keep the version in
# step with the `vite` alias in package.json and with vite-plus.
overrides:
    vite: 'npm:@voidzero-dev/vite-plus-core@8.3.8000'

